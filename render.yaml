services:
  - type: web
    name: queens-match
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: NOTIFICATION_PROVIDER
        value: whatsapp
      - key: NOTIFICATION_JOBS_CRON
        value: "0 * * * *"
      - key: REQUEST_BODY_LIMIT
        value: 32kb
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_QUERY_UNDERSTANDING_MODEL
        value: gemini-2.5-flash
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_EMAIL_FROM
        sync: false
      - key: TWILIO_EMAIL_FROM_NAME
        value: Queen's Match
