services:
  - type: web
    name: queens-match
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: BCRYPT_ROUNDS
        value: "12"
      # Gmail SMTP over IPv4 (see server/comms/providers/brevoProvider.js).
      - key: NOTIFICATION_PROVIDER
        value: email
      - key: NOTIFICATION_JOBS_CRON
        value: "*/5 * * * *"
      # Send notification email on the spot instead of after a digest delay.
      - key: NOTIFICATION_EMAIL_DELAY_MS
        value: "0"
      - key: REQUEST_BODY_LIMIT
        value: 32kb
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        value: https://ep-cold-math-b258daz2.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
      - key: REACT_APP_NEON_AUTH_URL
        value: https://ep-cold-math-b258daz2.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_QUERY_UNDERSTANDING_MODEL
        value: gemini-2.5-flash
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      # Public app origin used to build absolute email action links.
      # https://queenb-task-management-application.onrender.com
      - key: CLIENT_URL
        sync: false
      # Gmail address + Gmail App Password (never committed).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_EMAIL_FROM
        sync: false
      - key: TWILIO_EMAIL_FROM_NAME
        value: Queen's Match
