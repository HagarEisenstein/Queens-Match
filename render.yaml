services:
  - type: web
    name: queens-match
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: NOTIFICATION_PROVIDER
        value: console
      - key: NOTIFICATION_JOBS_CRON
        value: "0 * * * *"
      - key: DATABASE_URL
        sync: false
